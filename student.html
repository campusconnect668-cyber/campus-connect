
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Connect | Student Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b;padding:20px}
.container{max-width:440px;margin:45px auto;background:white;padding:28px;border-radius:14px;box-shadow:0 5px 20px #0001}
h1{text-align:center;color:#123b67;margin-bottom:8px}
p{text-align:center;color:#64748b}
.tabs{display:flex;gap:10px;margin:25px 0}
.tabs button{flex:1;padding:12px;border:0;border-radius:7px;background:#e2e8f0;cursor:pointer}
.tabs button.active{background:#123b67;color:white}
label{display:block;margin:15px 0 6px;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
.submit{width:100%;padding:14px;background:#123b67;color:white;border:0;border-radius:7px;margin-top:22px;font-size:16px;cursor:pointer}
.message{margin-top:16px;text-align:center;font-weight:bold}
.hidden{display:none}
a{display:block;text-align:center;margin-top:20px;color:#123b67}
</style>
</head>
<body>
<div class="container">
<h1>Campus Connect</h1>
<p>Student Portal</p>

<div class="tabs">
<button id="registerTab" class="active" type="button">Register</button>
<button id="loginTab" type="button">Login</button>
</div>

<form id="registerForm">
<label>Full Name</label>
<input id="fullName" type="text" maxlength="150" required>

<label>Email Address</label>
<input id="registerEmail" type="email" required>

<label>Password (minimum 8 characters)</label>
<input id="registerPassword" type="password" minlength="8" maxlength="128" required>

<button class="submit" type="submit">Create Account</button>
</form>

<form id="loginForm" class="hidden">
<label>Email Address</label>
<input id="loginEmail" type="email" required>

<label>Password</label>
<input id="loginPassword" type="password" required>

<button class="submit" type="submit">Login</button>
</form>

<div id="message" class="message" role="status"></div>
<a href="index.html">Back to Campus Connect Website</a>
</div>

<script>
const registerTab = document.getElementById("registerTab");
const loginTab = document.getElementById("loginTab");
const registerForm = document.getElementById("registerForm");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "green" : "crimson";
}

registerTab.onclick = () => {
  registerForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
  registerTab.classList.add("active");
  loginTab.classList.remove("active");
  showMessage("");
};

loginTab.onclick = () => {
  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");
  loginTab.classList.add("active");
  registerTab.classList.remove("active");
  showMessage("");
};

registerForm.onsubmit = async (event) => {
  event.preventDefault();
  showMessage("Creating your account...");

  try {
    const response = await fetch("/api/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        full_name: document.getElementById("fullName").value,
        email: document.getElementById("registerEmail").value,
        password: document.getElementById("registerPassword").value
      })
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Registration failed.");

    showMessage("Account created! You can now log in.", true);
    registerForm.reset();
    loginTab.click();
    document.getElementById("loginEmail").value =
      document.getElementById("registerEmail").value;
  } catch (error) {
    showMessage(error.message);
  }
};

loginForm.onsubmit = async (event) => {
  event.preventDefault();
  showMessage("Logging in...");

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value
      })
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Login failed.");

    sessionStorage.setItem("campusStudent", JSON.stringify(data.student));
    showMessage("Welcome, " + data.student.full_name + "! Login successful.", true);
  } catch (error) {
    showMessage(error.message);
  }
};
</script>
</body>
</html>
