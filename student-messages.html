
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Connect | Private Messages</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#123b67;color:white;padding:20px;text-align:center}
header a{color:white}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #0001}
h2{color:#123b67;margin-top:0}
select,input,textarea{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{background:#123b67;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}
button:disabled{opacity:.6}
#messages{max-height:450px;overflow-y:auto}
.message{padding:12px;margin:10px 0;border-radius:10px;background:#e2e8f0;overflow-wrap:anywhere}
.message.mine{background:#dbeafe;margin-left:10%}
.message strong{display:block;color:#123b67}
.message small{color:#64748b}
.status{padding:10px;color:#475569}
</style>
</head>
<body>

<header>
<h1>Campus Connect</h1>
<p>Private Student Messages</p>
<a href="student-dashboard.html">Back to Student Dashboard</a>
</header>

<main>
<section class="card">
<h2>Send a Private Message</h2>

<form id="messageForm">
<label for="receiver">Choose a student</label>
<select id="receiver" required>
<option value="">Loading students...</option>
</select>

<label for="messageText">Your Message</label>
<textarea id="messageText" maxlength="3000" required placeholder="Write your private message..."></textarea>

<button id="sendButton" type="submit">Send Message</button>
</form>

<div id="sendStatus" class="status" role="status"></div>
</section>

<section class="card">
<h2>Your Messages</h2>
<div id="messageStatus" class="status">Loading messages...</div>
<div id="messages"></div>
</section>
</main>

<script>
let currentStudentId = null;

const receiver = document.getElementById("receiver");
const messagesBox = document.getElementById("messages");

async function verifyStudent() {
  const response = await fetch("/api/student", {
    credentials: "same-origin",
    cache: "no-store"
  });

  const data = await response.json();

  if (!response.ok || !data.authenticated) {
    window.location.href = "student.html";
    return false;
  }

  currentStudentId = Number(data.student.id);
  return true;
}

async function loadStudents() {
  const response = await fetch("/api/directory", {
    credentials: "same-origin",
    cache: "no-store"
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Unable to load students.");
  }

  receiver.replaceChildren();

  const firstOption = document.createElement("option");
  firstOption.value = "";
  firstOption.textContent = "Select a student";
  receiver.appendChild(firstOption);

  (data.students || []).forEach(student => {
    if (Number(student.id) === currentStudentId) return;

    const option = document.createElement("option");
    option.value = student.id;
    option.textContent = student.full_name;
    receiver.appendChild(option);
  });
}

function displayMessages(items) {
  messagesBox.replaceChildren();

  if (!items.length) {
    document.getElementById("messageStatus").textContent =
      "No private messages yet.";
    return;
  }

  document.getElementById("messageStatus").textContent =
    items.length + " message(s)";

  items.forEach(item => {
    const box = document.createElement("div");
    box.className = "message";

    const mine = Number(item.sender_id) === currentStudentId;
    if (mine) box.classList.add("mine");

    const name = document.createElement("strong");
    name.textContent = mine
      ? "You → " + item.receiver_name
      : item.sender_name;

    const text = document.createElement("p");
    text.textContent = item.message;

    const date = document.createElement("small");
    date.textContent = item.created_at;

    box.append(name, text, date);
    messagesBox.appendChild(box);
  });

  messagesBox.scrollTop = messagesBox.scrollHeight;
}

async function loadMessages() {
  const response = await fetch("/api/messages", {
    credentials: "same-origin",
    cache: "no-store"
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Unable to load messages.");
  }

  displayMessages(data.messages || []);
}

document.getElementById("messageForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = document.getElementById("sendButton");
  const status = document.getElementById("sendStatus");

  button.disabled = true;
  status.textContent = "Sending message...";

  try {
    const response = await fetch("/api/messages", {
      method: "POST",
      credentials: "same-origin",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        receiver_id: receiver.value,
        message: document.getElementById("messageText").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Message could not be sent.");
    }

    document.getElementById("messageText").value = "";
    status.textContent = "Message sent successfully!";

    await loadMessages();

  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

async function startMessaging() {
  try {
    const authenticated = await verifyStudent();
    if (!authenticated) return;

    await loadStudents();
    await loadMessages();

  } catch (error) {
    document.getElementById("messageStatus").textContent = error.message;
  }
}

startMessaging();
</script>
</body>
</html>
